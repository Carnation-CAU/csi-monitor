[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csi-gateway"
version = "0.1.0"
description = "Cross-platform ESP32 Wi-Fi CSI serial collector"
requires-python = ">=3.10"
dependencies = [
  "pyserial>=3.5,<4",
]

[project.optional-dependencies]
gui = [
  "numpy>=2,<3",
  "pandas>=2,<4",
  "path>=17,<18",
  "PyQt5>=5.15,<6",
  "pyqtgraph>=0.13,<0.15",
  "scipy>=1.13,<2",
]
ml-runtime = [
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
]
ml-training = [
  "numpy>=2,<3",
  "scikit-learn>=1.5,<2",
  "torch>=2.4,<3",
  "xgboost>=2.1,<4",
]

[project.scripts]
csi-gateway = "csi_gateway.cli:main"

[tool.setuptools]
package-dir = {"" = "gateway/src"}

[tool.setuptools.packages.find]
where = ["gateway/src"]
